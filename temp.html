<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Safdie Architects profile and links page."
    />
    <title>Safdie Architects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="page-shell">
      <section class="profile-card" aria-label="Profile links card">
        <button
          class="theme-toggle"
          type="button"
          aria-label="Toggle light and dark mode"
          aria-pressed="false"
        >
          <span class="toggle-icon" aria-hidden="true">☀️</span>
        </button>

        <div class="profile-header">
          <div class="avatar" aria-label="Profile avatar">SA</div>
          <h1>Safdie Architects</h1>
          <p class="bio">
            Designing places that bring people together through bold, enduring
            ideas.
          </p>
        </div>

        <nav class="link-list" aria-label="Social links">
          <a
            class="link-button"
            href="https://www.safdiearchitects.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                <path d="M4 7.75A2.75 2.75 0 0 1 6.75 5h10.5A2.75 2.75 0 0 1 20 7.75v8.5A2.75 2.75 0 0 1 17.25 19H6.75A2.75 2.75 0 0 1 4 16.25v-8.5Zm2.3-.25 6.7 5.1 6.7-5.1H6.3Zm13.2 2.2-6.65 4.95a1 1 0 0 1-1.1 0L4.5 9.7v6.55c0 .69.56 1.25 1.25 1.25h12.5c.69 0 1.25-.56 1.25-1.25V9.7Z"/>

            rel="noopener noreferrer"

            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                <path d="M6.94 8.5A1.56 1.56 0 1 1 6.94 5.4a1.56 1.56 0 0 1 0 3.1ZM5.5 9.75h2.88v8.75H5.5V9.75Zm4.48 0h2.76v1.2h.04c.38-.72 1.32-1.48 2.72-1.48 2.92 0 3.46 1.92 3.46 4.41v4.62h-2.88v-4.33c0-1.03-.02-2.35-1.43-2.35-1.44 0-1.66 1.12-1.66 2.28v4.4H10V9.75Z"/>

            class="link-button"
            href="https://www.instagram.com/safdiearchitects/?hl=en"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" role="img" aria-hidden="true">
                <path d="M7.75 2h8.5A5.75 5.75 0 0 1 22 7.75v8.5A5.75 5.75 0 0 1 16.25 22h-8.5A5.75 5.75 0 0 1 2 16.25v-8.5A5.75 5.75 0 0 1 7.75 2Zm0 1.75A4 4 0 0 0 3.75 7.75v8.5A4 4 0 0 0 7.75 20.25h8.5a4 4 0 0 0 4-4v-8.5a4 4 0 0 0-4-4h-8.5Zm8.92 2.25a1.08 1.08 0 1 1 0 2.17 1.08 1.08 0 0 1 0-2.17ZM12 6.5A5.5 5.5 0 1 1 6.5 12 5.5 5.5 0 0 1 12 6.5Zm0 1.75A3.75 3.75 0 1 0 15.75 12 3.75 3.75 0 0 0 12 8.25Z"/>

          </a>
